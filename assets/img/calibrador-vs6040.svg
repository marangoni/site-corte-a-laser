        <line x1="162" y1="269" x2="206" y2="305"/>
        <line x1="238" y1="269" x2="282" y2="305"/>
        <line x1="314" y1="269" x2="358" y2="305"/>
        <line x1="390" y1="269" x2="434" y2="305"/>
