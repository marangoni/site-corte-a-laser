    <title id="title">
        Calibrador Laser VS6040
    </title>

    <desc id="desc">
        Matriz de potência e velocidade para calibração
        de corte e gravação a laser.
    </desc>

    <rect
        width="720"
        height="420"
        rx="34"
        fill="#f6f8fb"
    />

    <rect
        x="42"
        y="36"
        width="636"
        height="348"
        rx="26"
        fill="#ffffff"
        stroke="#d7e0ea"
        stroke-width="2"
    />

    <text
        x="74"
        y="88"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#172033"
