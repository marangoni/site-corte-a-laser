        <rect x="155" y="182" width="58" height="58" rx="5" stroke="#e33b3b"/>
        <rect x="231" y="182" width="58" height="58" rx="5" stroke="#e33b3b"/>
        <rect x="307" y="182" width="58" height="58" rx="5" stroke="#e33b3b"/>
        <rect x="383" y="182" width="58" height="58" rx="5" stroke="#e33b3b"/>
        <rect x="459" y="182" width="58" height="58" rx="5" stroke="#e33b3b"/>

        <rect x="155" y="258" width="58" height="58" rx="5" stroke="#315fcb"/>
        <rect x="231" y="258" width="58" height="58" rx="5" stroke="#315fcb"/>
        <rect x="307" y="258" width="58" height="58" rx="5" stroke="#315fcb"/>
        <rect x="383" y="258" width="58" height="58" rx="5" stroke="#315fcb"/>
        <rect x="459" y="258" width="58" height="58" rx="5" stroke="#315fcb"/>
